<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorya Kardam Art — Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><style>body{margin:0;background:#f7f2e9;color:#17130f;font-family:'DM Sans',sans-serif}.wrap{max-width:1200px;margin:auto;padding:25px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.head h1{font-family:'Playfair Display';font-size:36px}.box{background:white;border:1px solid #ddd0bc;border-radius:16px;padding:20px;margin:18px 0}.input{padding:12px;border:1px solid #cfc2af;border-radius:9px;width:min(100%,360px);font:inherit}.btn{border:0;border-radius:9px;padding:12px 16px;background:#17130f;color:#fff;font-weight:700;cursor:pointer}.order{border-top:1px solid #e5dac9;padding:20px 0;display:grid;grid-template-columns:1fr 180px;gap:20px}.thumb{width:180px;height:220px;object-fit:cover;border-radius:10px;border:1px solid #ddd}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:13px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#eee4d3}.status{padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit}.small{color:#6f675d;font-size:12px}@media(max-width:750px){.order{grid-template-columns:1fr}.thumb{width:100%;height:300px}.meta{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="head"><div><h1>Shorya Kardam Art</h1><div class="small">Private order dashboard</div></div><a href="/" class="btn">Open Store</a></div><div class="box"><label>Admin key </label><input id="key" class="input" type="password" placeholder="Enter ADMIN_KEY"><button class="btn" onclick="loadOrders()">Load Orders</button><span id="msg" class="small"></span></div><div id="orders"></div></div><script>let key='';async function loadOrders(){key=document.getElementById('key').value.trim();if(!key)return;const r=await fetch('/api/admin/orders?key='+encodeURIComponent(key));const j=await r.json();if(!r.ok){document.getElementById('msg').textContent='Invalid admin key';return}document.getElementById('msg').textContent=' '+j.length+' orders';document.getElementById('orders').innerHTML=j.map(o=>`<div class="box order"><div><h2 style="margin:0 0 7px">${o.id}</h2><div class="small">${new Date(o.createdAt).toLocaleString()}</div><p><b>${o.customer.name}</b> • ${o.customer.phone}<br>${o.customer.address}, ${o.customer.city}, ${o.customer.state||''} ${o.customer.pincode}, ${o.customer.country}</p><div class="meta"><div><b>Artwork</b><br>${o.artwork}</div><div><b>Size</b><br>${o.size} • ${o.persons} person(s)</div><div><b>Total</b><br>₹${o.total.toLocaleString('en-IN')}</div><div><b>Payment</b><br>${o.paymentMethod||'Not chosen'}</div><div><b>Payment status</b><br>${o.paymentStatus}</div><div><b>UTR</b><br>${o.utr||'—'}</div></div><p><b>Status:</b> <select class="status" onchange="updateStatus('${o.id}',this.value)"><option ${o.status==='New'?'selected':''}>New</option><option ${o.status==='Order Confirmed'?'selected':''}>Order Confirmed</option><option ${o.status==='Payment Verified'?'selected':''}>Payment Verified</option><option ${o.status==='In Progress'?'selected':''}>In Progress</option><option ${o.status==='Ready to Ship'?'selected':''}>Ready to Ship</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></p><p><a class="btn" target="_blank" href="/api/admin/file/${encodeURIComponent(o.referencePhoto)}?key=${encodeURIComponent(key)}">Open Client Photo</a> ${o.paymentScreenshot?`<a class="btn" target="_blank" href="/api/admin/file/${encodeURIComponent(o.paymentScreenshot)}?key=${encodeURIComponent(key)}">Payment Screenshot</a>`:''}</p></div><div><img class="thumb" src="/api/admin/file/${encodeURIComponent(o.referencePhoto)}?key=${encodeURIComponent(key)}" alt="Client reference photo"></div></div>`).join('')||'<div class="box">No orders yet.</div>'}async function updateStatus(id,status){const r=await fetch('/api/admin/orders/'+encodeURIComponent(id)+'?key='+encodeURIComponent(key),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)alert('Could not update status')} </script></body></html>
